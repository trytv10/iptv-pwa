name: Chequear canales caídos

on:
  schedule:
    # 03:00 UTC = 00:00 Uruguay (medianoche)
    - cron: '0 3 * * *'
    # 15:00 UTC = 12:00 Uruguay (mediodía)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limitar a N canales (para testing). Vacío = todos'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verificar FFmpeg
        run: ffmpeg -version | head -1

      - name: Correr chequeo
        env:
          LIMITE_CANALES: ${{ github.event.inputs.limite }}
        run: |
          python scripts/check_channels.py

      - name: Ver cambios
        id: verificar
        run: |
          git diff --quiet estado-canales.json canales.m3u8 && echo "cambios=false" >> $GITHUB_OUTPUT || echo "cambios=true" >> $GITHUB_OUTPUT

      - name: Commit y push
        if: steps.verificar.outputs.cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado-canales.json canales.m3u8
          git commit -m "chore: chequeo automático de canales [skip ci]"
          git pull --rebase origin main
          git push

      - name: Migrar estado a KV (automático)
        if: steps.verificar.outputs.cambios == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: https://iptv-proxy.eolivera119600.workers.dev
        run: |
          echo "Esperando 30s para que GitHub Pages/raw se actualice..."
          sleep 30
          curl -s -X POST "${WORKER_URL}/admin/migrar-estado?token=${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" | tee respuesta.json
          echo ""
          cat respuesta.json | python3 -c "import sys, json; d=json.load(sys.stdin); print('Total migrado:', d.get('total'), '| Resumen:', d.get('resumen'))" || true

      - name: Resumen del run
        if: always()
        run: |
          echo "### Resultado del chequeo" >> $GITHUB_STEP_SUMMARY
          if [ -f estado-canales.json ]; then
            python -c "
          import json
          with open('estado-canales.json') as f:
              d = json.load(f)
          r = d.get('resumen', {})
          print(f\"- Actualizado: {d.get('actualizado', 'N/A')}\")
          print(f\"- Total: {d.get('total', 0)}\")
          print(f\"- Estables: {r.get('estable', 0)}\")
          print(f\"- Inestables: {r.get('inestable', 0)}\")
          print(f\"- Caídos: {r.get('caido', 0)}\")
          print(f\"- Lentos: {r.get('lento', 0)}\")
          " >> $GITHUB_STEP_SUMMARY
          fi
