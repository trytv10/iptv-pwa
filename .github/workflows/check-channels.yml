name: Chequeo automatico de canales caidos

on:
  schedule:
    # Corre cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Revisar canales.m3u8
        run: python scripts/check_channels.py canales.m3u8

      - name: Subir cambios si hubo canales que cambiaron de estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Chequeo automatico de canales caidos [skip ci]"
          file_pattern: canales.m3u8
